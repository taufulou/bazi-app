name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '22'
  PYTHON_VERSION: '3.12'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      # B3-a. Runs BEFORE `npm ci` on purpose: it has no dependencies, and a
      # raw unkeyed call at the engine should fail the job in seconds rather
      # than after a full install.
      - name: Guard — every Bazi-engine call goes through the keyed helper
        run: node scripts/check-engine-callers.mjs
      - name: Guard — every AI provider call is metered and capped
        run: node scripts/check-ai-spend-metering.mjs
      - run: npm ci
      - name: Generate Prisma client
        run: cd apps/api && npx prisma generate
      - run: npx turbo lint

  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - name: Generate Prisma client
        run: cd apps/api && npx prisma generate
      - name: Typecheck API
        run: cd apps/api && npx tsc --noEmit
      - name: Typecheck Web
        run: cd apps/web && npx tsc --noEmit

  test-api:
    name: API Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - name: Generate Prisma client
        run: cd apps/api && npx prisma generate
      - name: Run API tests
        run: cd apps/api && npx jest --verbose --forceExit
        env:
          DATABASE_URL: 'postgresql://test:test@localhost:5432/test'
          REDIS_URL: 'redis://localhost:6379'
          CLERK_SECRET_KEY: 'sk_test_fake'
          CLERK_WEBHOOK_SECRET: 'whsec_test_fake'
          NODE_ENV: 'test'

  test-web:
    name: Web Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      # apps/web has no Prisma client of its own, and its specs mock every
      # network boundary, so no DB/Redis service containers are needed.
      - name: Run Web tests
        run: cd apps/web && npx jest --verbose
        env:
          NODE_ENV: 'test'

  test-bazi:
    name: Bazi Engine Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          cd packages/bazi-engine
          pip install -r requirements.txt
          pip install pytest
      - name: Run Bazi engine tests
        run: cd packages/bazi-engine && python -m pytest tests/ -v

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test-api, test-web, test-bazi]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - name: Generate Prisma client
        run: cd apps/api && npx prisma generate
      - name: Build API
        run: cd apps/api && npx nest build
      - name: Build Web
        run: cd apps/web && npx next build
        env:
          # Structurally valid, NOT a real key: Clerk decodes the publishable key
          # at prerender (base64 of "<frontend-api-host>$"), so the previous
          # 'pk_test_placeholder' parsed to null and threw "publishableKey passed
          # to Clerk is invalid" while prerendering /_not-found. Decodes to
          # example.clerk.accounts.dev — a domain that authenticates nothing.
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: 'pk_test_ZXhhbXBsZS5jbGVyay5hY2NvdW50cy5kZXYk'
          NEXT_PUBLIC_SITE_URL: 'https://bazi-platform.com'
